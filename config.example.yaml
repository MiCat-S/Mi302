# Mi302 設定檔（可以不用）
#
# 所有設定都可以在網頁上完成：啟動後用瀏覽器開 http://<這台機器的 IP>:8096/web
# 第一次打開會請你建立管理員帳號，接著在網頁上設定媒體庫、登入 115、選要同步的目錄。
#
# 這個檔案只在下面兩種情況需要：
#   1. 要改埠號（Docker 用戶改 docker-compose.yml 的埠對應就好，不用改這裡）
#   2. 想用檔案預先寫好設定（例如一次部署很多台）
# 要用時複製成 config.yaml，把需要的行前面的 # 拿掉。
# 注意：在網頁上儲存過的設定會蓋過這個檔案裡的同名項目。

# server:
#   port: 8096             # 播放器連線用的埠號
#   host: 0.0.0.0          # 監聽位址
#   name: Mi302            # 播放器裡顯示的伺服器名稱
#   data_dir: ./data       # 資料庫存放位置（Docker 版在 config/data）

# 預先建立的帳號：只在帳號不存在時建立，之後改密碼請用網頁
# users:
#   - name: admin
#     password: change-me
#     admin: true

# 預先建立的媒體庫。Docker 用戶寫容器內的路徑（主機的媒體資料夾在容器裡叫 /media）
# libraries:
#   - name: 電影
#     type: movies         # movies = 電影，tvshows = 劇集
#     paths:
#       - /media/movies
#   - name: 劇集
#     type: tvshows
#     paths:
#       - /media/tv

# 115 網盤。登入請用網頁掃碼；以下是預設值，一般不用改
# p115:
#   cookies: ""            # 直接寫 115 cookie，效果等同在網頁掃碼登入
#   app: alipaymini        # 掃碼登入時佔用的 115 裝置類型；同類型的其他登入會被踢下線
#   timeout: 15            # 呼叫 115 的逾時秒數
#   open_app_id: ""        # 115 開放平台 AppID，只有自己申請到應用的人才需要
#   strm:
#     interval: 0          # 每隔幾分鐘自動「增量」同步（讀 115 生活事件：上傳、移動、改名、刪除）；0 = 不自動，建議 5
#     full_interval: 168   # 每隔幾小時自動「全量」同步（重新比對整個目錄，查漏補缺）；預設每週
#     min_size_mb: 0       # 小於這個大小（MB）的影片不產生 strm
#     download_metadata: true   # 一併下載 nfo、海報、字幕
#     delete_stale: false       # 115 上刪掉或移出同步目錄的影片，本機的 strm 和刮削資料也跟著刪
#     base_url: ""         # strm 裡的伺服器網址，留空 = 自動使用開網頁時的網址
#     include_name: false  # strm 網址後附上 ?/原檔名
#     request_delay: 0.2   # 每列一個 115 目錄前等待的秒數
#     scan_after_sync: true     # 同步完自動重新掃描媒體庫
#     tasks:               # 同步任務；網頁上存過任務之後以網頁為準
#       - remote: /影視/電影
#         local: /media/movies/115

# 刮削交給 MoviePilot：新產生的 strm 送給 MoviePilot 查資料、寫 nfo 和海報
# MoviePilot 必須讀寫得到同一批 strm 檔案（兩個 Docker 容器掛同一個主機資料夾）
# moviepilot:
#   url: http://192.168.1.10:3000   # MoviePilot 網址
#   api_token: ""          # MoviePilot 的「設定 → 系統 → API 令牌」
#   username: ""           # 舊版 MoviePilot 的刮削 API 不接受令牌時，改填帳號密碼
#   password: ""
#   path_mappings:         # 兩邊看到的路徑不同時：Mi302 的路徑 → MoviePilot 的路徑
#     - from: /media
#       to: /mnt/media
#   scrape_after_sync: true   # 同步產生新的 strm 後自動送去刮削
#   timeout: 300           # 每一項刮削最多等幾秒

# 給其他工具產生的 strm（例如 alist 網址或本機路徑）
# redirect:
#   path_rules:            # 把 strm 內容開頭的 from 換成 to，再 302 給播放器
#     - from: /mnt/115
#       to: http://alist:5244/d/115
#   resolve_redirects: false  # 先由伺服器跟著上游重導向走到底
#   resolve_timeout: 10
#   cache_ttl: 90
#   require_auth: false    # 播放網址是否要求登入（很多播放器不帶 token）
#   default_container: mkv # strm 看不出影片格式時的預設格式

# api_keys: []             # 固定的 API 金鑰，給其他程式以管理員身分呼叫 API（網頁上也能建立）
