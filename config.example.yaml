# Emby 相容伺服器設定範例：複製為 config.yaml 後修改

server:
  name: My Emby            # 客戶端看到的伺服器名稱
  host: 0.0.0.0
  port: 8096               # Emby 預設埠號，客戶端通常預設連這個埠
  data_dir: ./data         # SQLite 資料庫放置處
  public_users: true       # 登入畫面是否列出使用者

users:                     # 啟動時建立或更新的帳號
  - name: admin
    password: change-me
    admin: true

libraries:
  - name: 電影
    type: movies           # movies 或 tvshows
    paths:
      - /media/movies
  - name: 劇集
    type: tvshows          # 每個子資料夾是一部劇，底下可有 Season 1 / S01 / 第1季 等季資料夾
    paths:
      - /media/tv

redirect:
  # strm 內容的前綴替換，可作用於本機路徑或網址
  # 例：strm 內寫 /mnt/115/電影/a.mkv → 302 到 http://alist:5244/d/115/電影/a.mkv
  path_rules:
    - from: /mnt/115
      to: http://alist:5244/d/115
  # 先由伺服器跟隨上游的重導向鏈，再把最終直鏈 302 給播放器
  resolve_redirects: false
  resolve_timeout: 10
  cache_ttl: 90            # 最終直鏈快取秒數
  require_auth: false      # 串流請求是否要求 token（很多播放器的串流請求不帶 token）
  default_container: mkv   # strm 網址看不出副檔名時回報的容器格式

# 額外的固定 API Key（以第一個管理員身分存取），可留空
api_keys: []

# 115 網盤：登入後，strm 內含 pickcode 的項目會由本伺服器直接向 115 取直鏈並 302
# 支援的 strm 內容：
#   http://<MoviePilot>/api/v1/plugin/P115StrmHelper/redirect_url?pickcode=xxx（P115StrmHelper 產生的格式）
#   http://<本伺服器>/p115/redirect?pickcode=xxx
#   115://xxx
# 登入方式：開 http://<本伺服器>:8096/web/115 用管理員帳號登入後掃碼，或在下方直接填 cookie
p115:
  cookies: ""
  app: alipaymini          # 掃碼綁定的裝置類型，同類型的舊登入會被踢下線
  timeout: 15
  # 從 115 產生 strm：把 115 目錄映射成本機資料夾，本機資料夾再設成上面的媒體庫路徑
  strm:
    tasks:
      - remote: /影視/電影     # 115 上的目錄
        local: /media/movies  # strm 輸出位置
      - remote: /影視/劇集
        local: /media/tv
    base_url: ""              # 例：http://192.168.1.10:8096；留空則 strm 寫成 115://pickcode
    download_metadata: true   # 一併下載 nfo、圖片、字幕
    delete_stale: false       # 刪除 115 上已不存在的 strm（與已下載的 nfo／圖片／字幕）
    min_size_mb: 0            # 小於此大小的影片不產生 strm，例如設 50 可略過預告片
    interval: 0               # 定時同步（分鐘），0 = 只手動
    request_delay: 0.2        # 每列一個目錄前等待的秒數，避免觸發 115 風控
    scan_after_sync: true     # 同步完自動重新掃描媒體庫
