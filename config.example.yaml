# ===== 範例 =====
# Mi302 第一次啟動時會自動產生 config.yaml，網頁上儲存設定時也會自動寫回，通常不需要複製這個檔案。
# 這裡列出所有項目和說明，方便對照。

# Mi302 設定檔
#
# 網頁 http://<這台機器的 IP>:<埠號>/web 上儲存設定時，會自動改寫這個檔案（舊檔留成 config.yaml.bak）。
# 也可以直接改這個檔案：網頁重新整理後就會套用；server 的 host、port、data_dir 要重新啟動才生效。
# 帳號密碼、115 登入狀態、網頁上建立的 API 金鑰存在資料庫，不在這裡。

server:
  name: Mi302                       # 播放器裡顯示的伺服器名稱
  host: 0.0.0.0                     # 監聽位址
  port: 8096                        # 播放器連線用的埠號（Docker 用戶改 docker-compose.yml 的埠對應就好）
  data_dir: ./data                  # 資料庫存放位置
  public_users: true                # 播放器登入畫面是否列出使用者
  log_level: info                   # 日誌：info = 一般，debug = 詳細（另外記錄每個播放器請求）

# 第一次啟動時預先建立的帳號；之後新增帳號、改密碼請用網頁，不會寫回這裡
users: []

# 媒體庫。type：movies = 電影，tvshows = 劇集。Docker 用戶寫容器內的路徑（例如 /media/movies）
libraries:
  - name: 電影
    type: movies
    paths:
      - /media/movies
  - name: 劇集
    type: tvshows
    paths:
      - /media/tv

# 115 網盤。登入請用網頁掃碼
p115:
  cookies: ''                       # 直接寫 115 cookie，效果等同在網頁掃碼登入（只在還沒登入時使用）
  app: alipaymini                   # 掃碼登入時佔用的 115 裝置類型；同類型的其他登入會被踢下線
  timeout: 15.0                     # 呼叫 115 的逾時秒數
  open_app_id: ''                   # 115 開放平台 AppID，只有自己申請到應用的人才需要
  strm:
    interval: 0                     # 每隔幾分鐘自動增量同步（讀 115 生活事件）；0 = 不自動，建議 5
    full_interval: 168              # 每隔幾小時自動全量同步（查漏補缺）；0 = 不自動，168 = 每週
    min_size_mb: 0                  # 小於這個大小（MB）的影片不產生 strm
    download_metadata: true         # 一併下載 115 上的 nfo、海報、字幕
    delete_stale: false             # 115 上刪掉或移出同步目錄的影片，本機的 strm 和刮削資料也跟著刪
    base_url: ''                    # strm 裡的伺服器網址，留空 = 自動使用開網頁時的網址
    include_name: false             # strm 網址後附上 ?/原檔名
    request_delay: 0.2              # 每列一個 115 目錄前等待的秒數
    scan_after_sync: true           # 同步完自動重新掃描媒體庫
    # 同步任務：115 目錄 → 本機資料夾（本機資料夾要在某個媒體庫裡）
    tasks:
      - remote: /影視/電影
        local: /media/movies/115

# 刮削交給 MoviePilot：新產生的 strm 送給 MoviePilot 查資料、寫 nfo 和海報
moviepilot:
  url: ''                           # MoviePilot 網址，例如 http://192.168.1.10:3000
  api_token: ''                     # MoviePilot 的「設定 → 系統 → API 令牌」
  username: ''                      # 舊版 MoviePilot 的刮削 API 不接受令牌時，改填帳號密碼
  password: ''
  scrape_after_sync: true           # 同步產生新的 strm 後自動送去刮削
  timeout: 300                      # 每一項刮削最多等幾秒
  # 兩邊看到的路徑不同時：Mi302 的路徑（from）→ MoviePilot 的路徑（to）
  path_mappings: []

# 給其他工具產生的 strm（例如 alist 網址或本機路徑）
redirect:
  resolve_redirects: false          # 先由伺服器跟著上游重導向走到底
  resolve_timeout: 10.0
  cache_ttl: 90
  require_auth: false               # 播放網址是否要求登入（很多播放器不帶 token）
  default_container: mkv            # strm 看不出影片格式時的預設格式
  # 把 strm 內容開頭的 from 換成 to，再 302 給播放器
  path_rules: []

# 固定的 API 金鑰，給其他程式以管理員身分呼叫 API（網頁上也能建立，那些存在資料庫）
api_keys: []
