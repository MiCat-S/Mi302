# 推到 main 或開 PR 時：各個支援的 Python 版本跑測試，加上 Ruff 檢查。
# 測試裡包含管理網頁的腳本語法（node --check）和說明文件的連結、設定鍵檢查。
name: 測試

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 安裝
        run: python -m pip install -r requirements.txt pytest ruff
      - name: Ruff
        run: ruff check embyserver tests
      - name: 測試
        run: python -m pytest -q
