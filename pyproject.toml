[project]
name = "embyserver"
version = "0.1.0"
description = "Emby 相容的影片管理伺服器，strm 播放以 302 重導向到真實網址"
requires-python = ">=3.10"
license = {text = "PolyForm-Noncommercial-1.0.0"}  # 不能用在商業用途，全文見 LICENSE.md
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27", "PyYAML>=6.0", "p115cipher>=0.0.5", "pycryptodome>=3.20", "pypinyin>=0.50", "zhconv>=1.4"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
embyserver = "embyserver.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["embyserver*"]

[tool.setuptools.package-data]
embyserver = ["web/*.html", "web/*.png"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# F：沒用到的 import、未定義的名稱；E9：語法錯誤；C90：函式太複雜
select = ["F", "E9", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["C90"]  # 測試裡的假 115、假 MoviePilot 用一個函式分派所有 API，本來就長
